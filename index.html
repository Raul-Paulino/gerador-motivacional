<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Frases Motivacionais 🌟</title>
    
    <link rel="icon" type="image/png" href="lampada.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <div class="container">
        <div class="card" id="quote-card">
            <div class="aspas">“</div>
            
            <p id="quote-text" class="quote-text">Carregando frase inspiradora...</p>
            <span id="quote-author" class="quote-author">- Autor</span>
            
            <div class="acoes">
                <button id="btn-copiar" class="btn-secundario" title="Copiar Frase">📋 Copiar</button>
                <button id="btn-whats" class="btn-secundario" title="Enviar no WhatsApp">📲 Enviar</button>
                <button id="btn-nova-frase" class="btn-principal">✨ Nova Frase</button>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script src="script.js"></script>
</body>
</html>
